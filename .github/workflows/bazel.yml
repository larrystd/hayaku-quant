name: bazel-build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: bazel-build-${{ runner.os }}
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Build C++ and Python targets
        run: ./op.sh build
      - name: Run serialization and Python package tests
        run: ./op.sh test
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt wheel
      - name: Run Python regression suite
        run: ./op.sh python-test
      - name: Build and verify wheels
        run: |
          ./op.sh wheel
          ./op.sh wheel-ingest
          ./op.sh wheel-realtime
          python3.10 bazel/check_wheels.py
