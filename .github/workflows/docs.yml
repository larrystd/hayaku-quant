name: docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install nbformat
          python -m pip install -r docs/requirements.txt
      - name: Build English docs
        run: sphinx-build -b html docs/en docs/_build/en
      - name: Build Chinese docs
        run: sphinx-build -b html docs/zh docs/_build/zh
      - name: Check docs parity
        run: python docs/tools/check_docs_parity.py
      - name: Check README parity
        run: python docs/tools/check_readme_parity.py
